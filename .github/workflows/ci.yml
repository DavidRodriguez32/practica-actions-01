name: CI Workflow

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Ejecutando linter..."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test

      - name: Usar secreto sin exponerlo
        env:
          MI_SECRETO: ${{ secrets.SALUDO_SECRETO }}
        run: echo "El secreto tiene $(echo -n "$MI_SECRETO" | wc -c) caracteres"

      - name: Avisar de fallo
        if: failure()
        run: echo "Algún step anterior ha fallado"

      - name: Limpieza final
        if: always()
        run: echo "Esto se ejecuta pase lo que pase"

  solo-en-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Esto solo se ve en main"
