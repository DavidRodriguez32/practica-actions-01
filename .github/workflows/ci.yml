name: Práctica GitHub Actions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Ejecuta los tests en múltiples versiones de Node.js en paralelo
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

  # Job independiente para comprobar la versión (corre en paralelo)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Comprobar versión de Node
        run: node --version

  # Este es el nuevo job que se ejecuta solo si estás en la rama main
  solo-en-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensaje en main
        run: echo "Esto solo se ve en main"
